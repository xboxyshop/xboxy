name: Publish Golden Pulse video
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-video:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rebuild and verify MP4
        shell: bash
        run: |
          cat video_parts/part1.txt video_parts/part2.txt video_parts/part3.txt video_parts/part4.txt | tr -d '\r\n\t ' | base64 --decode > massaggiatore-viso.mp4
          actual="$(git hash-object massaggiatore-viso.mp4)"
          echo "Reconstructed video git blob SHA: $actual"
          test "$(wc -c < massaggiatore-viso.mp4)" -gt 1000
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -show_entries format=duration -of default=noprint_wrappers=1 massaggiatore-viso.mp4
          ffmpeg -v error -i massaggiatore-viso.mp4 -f null -
      - name: Commit video and clean temporary chunks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf video_parts
          git add -A massaggiatore-viso.mp4 video_parts
          git commit -m "Add verified Golden Pulse facial massager video"
          git push
